# SPDX-License-Identifier: GPL-3.0-only
# Builds the SDK image, runs the portable tests under sanitizers, builds the host and probes in both flavors (normal and
# debug, from the same commit), packs both release archives and both app zips, and keeps them as workflow artifacts. On
# a v* tag it also attaches them to a draft release; the owner publishes it after the console check. Third-party builds
# (out/deps) are cached by the pinned sources and build scripts, the ps5-opengl SDK the app needs by its pin.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: No private data in tracked files
        # The repo is public; this catches a LAN address, home folder or e-mail address before the long build.
        run: bash scripts/check_private.sh

      - name: Shell scripts (shellcheck)
        # Warnings and errors only; the image is pinned by digest like the actions.
        run: |
          docker run --rm -v "$PWD":/repo:ro -w /repo \
            koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb \
            --severity=warning -x scripts/*.sh scripts/deps/*.sh scripts/hooks/pre-commit $(find tools app -name '*.sh')

      - name: Build SDK image
        run: docker build -t prosperosunshine-sdk:v0.45 -f scripts/Dockerfile .

      - name: Cache third-party builds
        id: deps-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # deps.sh rebuilds a library whenever its extracted source tree is missing, so the
          # extracted trees are cached together with the build output.
          path: |
            out/deps
            .cache/deps/dl
            .cache/deps/src
          key: deps-${{ hashFiles('deps.lock', 'scripts/deps.sh', 'scripts/deps/**', 'patches/**', 'scripts/Dockerfile') }}
          # An older cache still has the downloaded archives, so a run doesn't depend on every
          # upstream server being reachable. deps.sh checks each archive against deps.lock.
          restore-keys: deps-

      - name: Keep only the downloads from an older cache
        # Builds from an older cache may not match changed patches, dependencies or the SDK image.
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: rm -rf out/deps .cache/deps/src

      - name: Unit tests (ASan/UBSan)
        run: docker run --rm --mount type=bind,source="$PWD",target=/repo prosperosunshine-sdk:v0.45 bash scripts/test.sh

      - name: Build host and probes
        run: docker run --rm -e PROSPERO_COMMIT="${GITHUB_SHA::8}" --mount type=bind,source="$PWD",target=/repo prosperosunshine-sdk:v0.45 bash scripts/build.sh

      - name: Build the debug flavor
        # The same commit with PROSPERO_DEBUG=ON, into out/debug (README, "Debug build").
        run: docker run --rm -e PROSPERO_COMMIT="${GITHUB_SHA::8}" -e PROSPERO_DEBUG=1 --mount type=bind,source="$PWD",target=/repo prosperosunshine-sdk:v0.45 bash scripts/build.sh

      - name: Package
        # A tag v1.2.3 packs as 1.2.3, as the releases are named; anything else as <branch>-<commit>.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::8}"; fi
          bash scripts/package.sh "$version"
          PROSPERO_DEBUG=1 bash scripts/package.sh "$version"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prosperosunshine-${{ github.sha }}
          path: dist/*.tar.gz

      - name: Keep the debug host's line info
        # Not in the user's zip: with these, `llvm-addr2line -f -e prospero_sunshine.debug.elf <address>` turns a crash
        # address from klog into a function, file and line (the debug ELF that ships has the same code and addresses).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prosperosunshine-debug-symbols-${{ github.sha }}
          path: |
            out/debug/prospero_sunshine.debug.elf
            out/debug/prospero_sunshine.map

      - name: Hand the hosts to the app job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosts-${{ github.sha }}
          retention-days: 1
          path: |
            out/prospero_sunshine.elf
            out/debug/prospero_sunshine.elf
            out/deps/licenses

      - name: Let the cache step read the dependency builds
        # The container writes them as root, and actions/cache saves them after the job as the runner
        # user; files it can't read made every save fail, so each run fetched and built everything anew.
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" out .cache || true

  # The app (app/build.sh) in both flavors. Its one input from outside, the ps5-opengl SDK, comes from PS5SD's
  # scripts/build-opengl-sdk.sh at a pinned commit, built once (30 to 60 minutes) and then cached.
  app:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PS5SD_URL: https://github.com/Darkatek7/PS5SD
      PS5SD_REV: 0654534bc7042d9164167835fba67e74215f1617  # v1.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hosts-${{ github.sha }}
          path: out

      - name: Restore the ps5-opengl SDK
        id: glcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/app/ps5-opengl-sdk
          key: ps5-opengl-sdk-${{ env.PS5SD_REV }}

      - name: Build the ps5-opengl SDK with PS5SD
        if: steps.glcache.outputs.cache-hit != 'true'
        run: |
          # Mesa's build tree and both opengnm-psbc builds take several GiB.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          git clone -q "$PS5SD_URL" "$RUNNER_TEMP/ps5sd"
          git -C "$RUNNER_TEMP/ps5sd" checkout -q --detach "$PS5SD_REV"
          docker build --platform linux/amd64 -t ps5sd-build "$RUNNER_TEMP/ps5sd/docker"
          docker run --rm --platform linux/amd64 -v "$RUNNER_TEMP/ps5sd":/work -w /work ps5sd-build \
            bash -c 'git config --global --add safe.directory "*" && scripts/build-opengl-sdk.sh'
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/ps5sd/.deps"
          mkdir -p .cache/app
          cp -a "$RUNNER_TEMP/ps5sd/.deps/ps5-opengl-sdk" .cache/app/ps5-opengl-sdk
          (cd .cache/app/ps5-opengl-sdk && sha256sum --check --strict --quiet manifest.sha256)

      - name: Save the ps5-opengl SDK
        if: steps.glcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/app/ps5-opengl-sdk
          key: ps5-opengl-sdk-${{ env.PS5SD_REV }}

      - name: ps5-opengl build log
        if: failure() && steps.glcache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ps5-opengl-build-log
          path: ${{ runner.temp }}/ps5sd/.deps/ps5-opengl-work/build.log
          if-no-files-found: ignore

      - name: Build the app image
        run: docker build -t prosperosunshine-app:2 -f app/Dockerfile app

      - name: Build the app, normal and debug
        run: |
          for flavor in normal debug; do
            docker run --rm -e APP_FLAVOR=$flavor --mount type=bind,source="$PWD",target=/repo \
              --mount type=bind,source="$PWD/.cache/app",target=/cache prosperosunshine-app:2 bash app/build.sh
          done
          mkdir -p dist-app
          cp build/app/PPSA47989.zip build/app-debug/PPSA47989-debug.zip dist-app/
          sha256sum dist-app/*.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PPSA47989-${{ github.sha }}
          path: dist-app/*.zip

  # A v* tag: both flavors from this commit on a draft release, with their SHA256. Publishing stays a hand step.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prosperosunshine-${{ github.sha }}
          path: assets

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: PPSA47989-${{ github.sha }}
          path: assets

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd assets
          version="${GITHUB_REF_NAME#v}"
          files=(PPSA47989.zip "prosperosunshine-$version.tar.gz" PPSA47989-debug.zip "prosperosunshine-$version-debug.tar.gz")
          sha256sum "${files[@]}" > SHA256SUMS
          {
            echo "Built by CI from ${GITHUB_SHA} (both flavors from this commit)."
            echo
            echo "- \`PPSA47989.zip\`: the app with the host, the normal build."
            echo "- \`PPSA47989-debug.zip\`: the debug build, to reproduce a problem once and post the diagnostics report;"
            echo "  not meant for daily use (README, \"Debug build\"). Go back to \`PPSA47989.zip\` afterwards."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md
          # A tag with a suffix (v0.3.3-pads-1) is a test build for an issue, as before.
          prerelease=()
          [[ "$version" != *-* ]] || prerelease=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A release made by hand (gh release create, CLAUDE.md) was tested on the console, and the store's catalog has
            # its zip's sha256: its files stay. Only the ones it doesn't have yet (the debug flavor) are added.
            have=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
            missing=()
            for f in "${files[@]}"; do grep -qxF "$f" <<< "$have" || missing+=("$f"); done
            if [ ${#missing[@]} -gt 0 ]; then
              sha256sum "${missing[@]}" > SHA256SUMS-ci
              gh release upload "$GITHUB_REF_NAME" "${missing[@]}" SHA256SUMS-ci
            fi
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" SHA256SUMS --draft --verify-tag "${prerelease[@]}" \
              --title "$version" --notes-file notes.md
          fi
